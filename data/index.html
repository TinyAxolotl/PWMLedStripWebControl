<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP Control</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="card" aria-label="Brightness control panel">
    <h1>ESP Control</h1>

    <section class="section" aria-labelledby="pwmTitle">
      <div class="row">
        <div class="label">
          <div class="label-title" id="pwmTitle">PWM</div>
          <div class="label-sub">0…4095</div>
        </div>

        <output id="pwmValue" class="readout" aria-label="Current PWM val">%SLIDERVALUE%</output>
      </div>

      <label class="sr-only" for="pwmSlider">PWM slider</label>
      <input
        class="slider"
        type="range"
        id="pwmSlider"
        min="0"
        max="4095"
        step="1"
        value="%SLIDERVALUE%"
      />

      <div class="actions" aria-label="Actions">
        <button class="btn" id="resetBtn" type="button">Reset</button>
        <div class="status" id="status" role="status" aria-live="polite">Ready</div>
      </div>
    </section>
  </main>

  <script>
    const slider   = document.getElementById("pwmSlider");
    const valueEl  = document.getElementById("pwmValue");
    const statusEl = document.getElementById("status");
    const resetBtn = document.getElementById("resetBtn");

    const MIN = Number(slider.min);
    const MAX = Number(slider.max);

    function clamp(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return null;
      return Math.min(MAX, Math.max(MIN, Math.round(v)));
    }

    function setStatus(text, kind = "ok") {
      statusEl.textContent = text;
      statusEl.dataset.kind = kind;
    }

    function setSliderFill(v) {
      const p = ((v - MIN) / (MAX - MIN)) * 100;
      // IMPORTANT: avoid raw percent sign in this HTML because ESPAsyncWebServer template
      // processor treats percent sign as a placeholder delimiter.
      slider.style.setProperty("--p", `${p}\u0025`);
    }

    function setUI(v) {
      slider.value = String(v);
      valueEl.textContent = String(v);
      setSliderFill(v);
    }

    // Debounce to avoid spamming ESP while dragging
    let sendTimer = null;
    function sendSliderValue(v) {
      clearTimeout(sendTimer);
      sendTimer = setTimeout(async () => {
        try {
          setStatus("Sending…", "warn");
          const r = await fetch(`/slider?value=${encodeURIComponent(v)}`, { cache: "no-store" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          setStatus("Applied", "ok");
        } catch {
          setStatus("Sending error", "err");
        }
      }, 120);
    }

    slider.addEventListener("input", () => {
      const v = clamp(slider.value);
      if (v === null) return;
      setUI(v);
      sendSliderValue(v);
    });

    async function readDeviceValue() {
      const r = await fetch("/initial-slider-value", { cache: "no-store" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const t = (await r.text()).trim();
      const v = clamp(t);
      if (v === null) throw new Error("not a number");
      return v;
    }

    setUI(clamp(slider.value) ?? MIN);

    (async () => {
      try {
        const v = await readDeviceValue();
        setUI(v);
        setStatus("Value had been loaded", "ok");
      } catch {
        setStatus("Working without autoload", "warn");
      }
    })();

    resetBtn.addEventListener("click", async () => {
      resetBtn.disabled = true;

      try {
        setStatus("Reload…", "warn");
        const r = await fetch("/reset", { cache: "no-store" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        // helps complete the request before ESP resets the connection
        try { await r.text(); } catch {}
      } catch {
        setStatus("Reset не удался", "err");
        resetBtn.disabled = false;
        return;
      }

      // Poll for the device to come back (up to 15 seconds)
      const started = Date.now();
      const maxMs = 15000;
      const intervalMs = 900;

      const tick = async () => {
        if (Date.now() - started > maxMs) {
          setStatus("The device is still reloading", "warn");
          resetBtn.disabled = false;
          return;
        }
        try {
          const v = await readDeviceValue();
          setUI(v);
          setStatus("Online", "ok");
          resetBtn.disabled = false;
        } catch {
          setStatus("Waiting for the device…", "warn");
          setTimeout(tick, intervalMs);
        }
      };

      setTimeout(tick, 1200);
    });
  </script>
</body>
</html>
